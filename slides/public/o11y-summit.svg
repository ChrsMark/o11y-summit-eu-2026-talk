  <!-- Text: event name -->
  <text x="62" y="30" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="white" letter-spacing="-0.2">Observability Summit</text>
  <text x="62" y="52" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.72)">Europe · October 2026</text>
