<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 68" role="img">
  <title>Observability Summit Europe 2026</title>
  <!-- Node-network icon (matches brand) -->
  <line x1="14" y1="54" x2="28" y2="26" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="28" y1="26" x2="46" y2="10" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Nodes: large bottom-left, medium middle, small top-right -->
